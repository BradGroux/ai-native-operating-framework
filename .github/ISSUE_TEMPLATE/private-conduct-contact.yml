name: Private conduct contact request
description: Ask the founding steward to establish a private reporting channel.
title: "Private conduct contact requested"
body:
  - type: markdown
    attributes:
      value: |
        Do not include names, allegations, evidence, contact details, or other sensitive information in this public request. The steward will establish a private reporting channel.
  - type: checkboxes
    id: public-safety
    attributes:
      label: Public-request safety
      options:
        - label: I have not included sensitive details in this public request.
          required: true
